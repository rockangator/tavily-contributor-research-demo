[project]
name = "contributor-lens"
version = "0.1.0"
description = "Evidence-led contributor analysis for open-source software supply chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
  "tavily-python>=0.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
